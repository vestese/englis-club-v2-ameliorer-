services:
  - type: web
    name: club-anglais-accra
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k gevent -w 1 --bind 0.0.0.0:$PORT --timeout 120 qserver:app
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false   # Set this manually in the Render dashboard as a secret
